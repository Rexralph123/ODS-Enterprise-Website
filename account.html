<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — O.D.S Enterprise</title>
<link rel="icon" type="image/png" href="assets/backgroundless logo 1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<nav class="nav">

  <div class="nav-brand">
    <div class="nav-logo">
      <img src="assets/logo.png" alt="O.D.S Enterprise Logo">
    </div>

    <div class="nav-brand-text">
      <span class="nav-brand-name">ODS Enterprise</span>
      <span class="nav-brand-sub">Electronics & Phones</span>
    </div>
  </div>

  <div class="nav-links" id="navLinks">
    <a class="nav-btn" data-page="shop" href="index.html"><i class="ti ti-device-mobile"></i> Shop</a>
    <a class="nav-btn" data-page="about" href="about.html"><i class="ti ti-info-circle"></i> About Us</a>
    <a class="nav-btn" id="accountBtn" href="#"><i class="ti ti-user"></i> Account</a>
  </div>

  <a class="cart-btn" href="cart.html">
    <i class="ti ti-shopping-cart" aria-hidden="true"></i>
    Cart
    <span class="cart-badge" id="cart-count">0</span>
  </a>

  <!-- MOBILE MENU BUTTON -->
<button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation menu">
  <span class="hamburger"></span>
  <span class="hamburger"></span>
  <span class="hamburger"></span>
</button>

</nav>

<div class="account-layout">
  <div class="account-header">
    <div class="avatar">JD</div>
    <div>
      <div class="account-name">John Doe</div>
      <div class="account-email">john.doe@email.com</div>
      <div style="margin-top:6px"><span style="background:rgba(201,151,58,0.2);color:var(--ods-gold);padding:2px 10px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid rgba(201,151,58,0.3)">Premium Member</span></div>
    </div>
  </div>

  <div class="account-tabs">
    <button class="account-tab active" onclick="switchAccountTab('orders',this)">Order History</button>
    <button class="account-tab" onclick="switchAccountTab('profile',this)">Profile</button>
    <button class="account-tab" onclick="switchAccountTab('address',this)">Addresses</button>
  </div>

  <div id="account-tab-content"></div>
</div>

<script src="assets/cart.js"></script>
<script>
function renderAccountTab(tab){
  const content = document.getElementById('account-tab-content');

  if(tab === 'orders'){
    content.innerHTML = ORDERS.map(o=>{
      const sc = o.status==='Delivered' ? 'delivered' : o.status==='Shipped' ? 'shipped' : 'processing';
      return `<div class="order-card">
        <div class="order-header">
          <div><div class="order-id">${o.id}</div><div class="order-date">${o.date}</div></div>
          <span class="status-badge status-${sc}">${o.status}</span>
        </div>
        <div class="order-items-list">${o.items}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="order-total">${fmt(o.total)}</div>
          <button class="track-order-btn"><i class="ti ti-package" aria-hidden="true"></i> Track</button>
        </div>
      </div>`;
    }).join('');
  } else if(tab === 'profile'){
    content.innerHTML = `<div class="profile-form">
      <div class="form-row"><div class="form-group"><label>First name</label><input value="John"></div><div class="form-group"><label>Last name</label><input value="Doe"></div></div>
      <div class="form-row"><div class="form-group"><label>Email</label><input value="john.doe@email.com"></div><div class="form-group"><label>Phone</label><input value="+234 801 234 5678"></div></div>
      <div class="form-row single"><div class="form-group"><label>Change password</label><input type="password" placeholder="New password"></div></div>
      <button class="save-btn">Save Changes</button>
    </div>`;
  } else {
    content.innerHTML = `<div class="profile-form">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <span style="font-size:14px;font-weight:600">Saved Addresses</span>
        <button class="save-btn" style="font-size:13px;padding:7px 16px">+ Add Address</button>
      </div>
      <div class="addr-card">
        <div style="font-size:13px;font-weight:600;margin-bottom:4px">Home <span class="addr-default-tag">Default</span></div>
        <div style="font-size:13px;color:var(--text-secondary)">15 Adeola Odeku Street, Victoria Island<br>Lagos, Lagos State 101001</div>
      </div>
    </div>`;
  }
}

function switchAccountTab(tab, btn){
  document.querySelectorAll('.account-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderAccountTab(tab);
}

setActiveNav('account');
renderAccountTab('orders');




/*Mobile NAV*/
const mobileMenuBtn = document.getElementById("mobileMenuBtn");
const navLinks = document.getElementById("navLinks");

mobileMenuBtn.addEventListener("click", function () {
    navLinks.classList.toggle("active");
    mobileMenuBtn.classList.toggle("active");

    if (navLinks.classList.contains("active")) {
        mobileMenuBtn.setAttribute(
            "aria-label",
            "Close navigation menu"
        );
    } else {
        mobileMenuBtn.setAttribute(
            "aria-label",
            "Open navigation menu"
        );
    }
});

document.querySelectorAll(".nav-links a").forEach(link => {
    link.addEventListener("click", function () {
        navLinks.classList.remove("active");
        mobileMenuBtn.classList.remove("active");

        mobileMenuBtn.setAttribute(
            "aria-label",
            "Open navigation menu"
        );
    });
});
</script>
</body>
</html>
